name: Build IKUN for Windows

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --no-audit

      # 禁用内部自动发布，本地静默编译
      - name: Build and Package Windows Executable
        run: npx electron-builder --win --x64 -p never

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      # 采用 PowerShell 完美兼容带中文和空格的安装包文件名
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "build-${{ steps.vars.outputs.sha_short }}" }
          $releaseTitle = "ikun Windows Release (" + (if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "${{ steps.vars.outputs.sha_short }}" }) + ")"
          
          $files = Get-ChildItem -Path "dist/*.exe" | Select-Object -ExpandProperty FullName

          if (-not $files) {
            Write-Error "未找到 dist/*.exe 打包产物！"
            exit 1
          }

          gh release create $tagName $files --title "$releaseTitle" --generate-notes --clobber
