name: Build IKUN for Windows

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --no-audit

      # 1. 禁用 electron-builder 内部自动发布，避免与后续步骤产生竞态冲突
      - name: Build and Package Windows Executable
        run: npx electron-builder --win --x64 -p never

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      # 2. 统一由 action-gh-release 执行发布与文件上传
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: ikun Windows Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.vars.outputs.sha_short }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', steps.vars.outputs.sha_short) }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
