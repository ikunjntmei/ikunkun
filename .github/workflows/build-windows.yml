name: Build IKUN for Windows

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --no-audit

      # 1. 纯本地编译，不触发 electron-builder 内部发布
      - name: Build and Package Windows Executable
        run: npx electron-builder --win --x64 -p never

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      # 2. 改用 GitHub 原生官方 CLI 发布，彻底避免 action-gh-release 更新元数据时的 404 Bug
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', steps.vars.outputs.sha_short) }}"
          RELEASE_TITLE="ikun Windows Release (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.vars.outputs.sha_short }})"
          
          # 创建 Release 并且只上传 dist/*.exe 两个目标文件
          gh release create "$TAG_NAME" dist/*.exe \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --clobber
