name: Build and Release DMG

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.11)'
        required: true
        default: '0.5.15'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Package macOS app
        run: |
          test -s electron/assets/icon.icns
          npx electron-packager . IKUN \
            --platform=darwin --arch=arm64 \
            --icon=electron/assets/icon.icns \
            --out=dist --overwrite --prune \
            '--ignore=^/(test|.browsers|dist)'
      - name: Verify packaged icon
        run: |
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/IKUN-darwin-arm64/IKUN.app/Contents/Info.plist)
          cmp electron/assets/icon.icns "dist/IKUN-darwin-arm64/IKUN.app/Contents/Resources/$ICON_NAME"
      - name: Ad-hoc sign and verify app
        run: |
          codesign --force --deep --sign - dist/IKUN-darwin-arm64/IKUN.app
          codesign --verify --deep --strict --verbose=2 dist/IKUN-darwin-arm64/IKUN.app
      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          brew install create-dmg
          mkdir -p dmg-staging
          cp -R dist/IKUN-darwin-arm64/IKUN.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          create-dmg --volname "IKUN" "IKUN-${RELEASE_VERSION}-mac-arm64.dmg" dmg-staging/
          hdiutil verify "IKUN-${RELEASE_VERSION}-mac-arm64.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/ikun-verify" "IKUN-${RELEASE_VERSION}-mac-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ikun-verify/IKUN.app"
          hdiutil detach "$RUNNER_TEMP/ikun-verify"
          tar -czf "IKUN-${RELEASE_VERSION}-mac-arm64.dmg.tar.gz" "IKUN-${RELEASE_VERSION}-mac-arm64.dmg"
          shasum -a 256 *.dmg *.dmg.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: IKUN v${{ inputs.version }}
          make_latest: true
          files: |
            *.dmg
            *.dmg.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
