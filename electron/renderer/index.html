<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>IKUN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="side-head">
        <div class="app-name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          IKUN
        </div>
        <div class="side-head-icons">
          <button class="icon-btn" id="btn-search" title="搜索环境">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
        </div>
      </div>

      <nav class="menu">
        <button class="menu-item" data-page="new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          新建环境
        </button>
        <button class="menu-item active" data-page="profiles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="14" x="3" y="3" rx="2"/><path d="M7 21h10M12 17v4"/></svg>
          环境管理
        </button>
        <button class="menu-item" data-page="proxies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          代理管理
        </button>
        <button class="menu-item" data-page="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          系统设置
        </button>
        <button class="menu-item" id="btn-minimize-tray" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
          最小化到托盘
        </button>
      </nav>

      <div class="side-section grow" id="group-section">
        <button class="side-title" id="group-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          分组
        </button>
        <div class="group-list" id="group-list"></div>
      </div>

      <div class="side-foot" id="app-version" style="display: none !important;"></div>
    </aside>

    <!-- 主展示区 -->
    <main class="main">
      <!-- 提示横幅 -->
      <div id="browser-banner" class="banner hidden">
        <span>尚未安装 Chromium 内核，请先完成安装以启动环境。</span>
        <button class="btn small primary" id="btn-banner-download">前往设置下载</button>
      </div>

      <!-- 新建环境页面 -->
      <section id="page-new" class="page hidden">
        <div class="page-head">
          <h1>新建环境</h1>
        </div>
        <div class="card" style="max-width: 600px;">
          <div class="field">
            <label>分组</label>
            <input id="n-group" class="input" list="n-group-list" placeholder="选填，可选已有分组或直接输入">
            <datalist id="n-group-list"></datalist>
          </div>
          <div class="field">
            <label>代理</label>
            <div style="display:flex;gap:8px">
              <select id="n-proxy" class="input" style="flex:1"></select>
              <button type="button" id="n-proxy-check" class="btn" style="flex-shrink:0">检测代理</button>
            </div>
            <div id="n-proxy-result" style="font-size:12px;color:var(--muted);margin-top:4px"></div>
          </div>
          <details class="advanced" open>
            <summary>高级指纹设置</summary>
            <div class="field-row" style="margin-top:10px">
              <div class="field">
                <label>语言</label>
                <select id="n-locale" class="input"></select>
              </div>
              <div class="field">
                <label>时区</label>
                <select id="n-tz" class="input"></select>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>分辨率</label>
                <select id="n-vp" class="input"></select>
              </div>
              <div class="field">
                <label>WebRTC</label>
                <select id="n-webrtc" class="input">
                  <option value="auto">自动（限制直连 UDP）</option>
                  <option value="default">不限制（不建议选）</option>
                  <option value="restricted">限制直连 UDP</option>
                </select>
              </div>
            </div>
          </details>
          <div class="modal-foot" style="margin-top:24px">
            <button class="btn" id="n-save">仅创建</button>
            <button class="btn primary" id="n-save-open">创建并打开</button>
          </div>
        </div>
      </section>

      <!-- 环境管理页面 -->
      <section id="page-profiles" class="page">
        <div class="page-head">
          <h1>环境管理</h1>
          <div class="toolbar">
            <input type="text" id="profile-search" class="input search" placeholder="搜索环境名称或分组…">
            <button class="btn" id="btn-refresh-profiles">刷新</button>
            <button class="btn primary" id="btn-open-profiles">批量打开</button>
            <button class="btn danger-ghost" id="btn-del-profiles">批量删除</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="profile-all"> 全选本页
          </label>
          <span id="profile-count">已选 0 项</span>
        </div>
        <div class="env-cards" id="profiles-list"></div>
      </section>

      <!-- 代理管理页面 -->
      <section id="page-proxies" class="page hidden">
        <div class="page-head">
          <h1>代理管理</h1>
          <div class="toolbar">
            <button class="btn primary" id="btn-add-proxy">添加代理</button>
            <button class="btn" id="btn-check-proxies">批量检测</button>
            <button class="btn danger-ghost" id="btn-del-proxies">批量删除</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="proxy-all"> 全选本页
          </label>
          <span id="proxy-count">已选 0 项</span>
        </div>
        <div class="proxy-cards" id="proxies-list"></div>
      </section>

      <!-- 设置页面 -->
      <section id="page-settings" class="page hidden">
        <div class="page-head">
          <h1>系统设置</h1>
        </div>
        <div class="cards">
          <!-- 内核管理 -->
          <div class="card">
            <h2>Chromium 内核</h2>
            <div id="browser-status"></div>
            <div class="progress hidden" id="browser-progress"><div class="bar"></div></div>
            <div style="margin-top:14px">
              <button class="btn small primary" id="btn-download-browser">下载 Chromium</button>
            </div>
            <div class="hint">用于隔离执行的独立浏览器渲染引擎。</div>
          </div>

          <!-- 网络设置 -->
          <div class="card">
            <h2>网络</h2>
            <label>SOCKS5 代理通过系统代理连接</label>
            <div class="row">
              <select id="set-socks-system-proxy" class="input">
                <option value="no">否</option>
                <option value="yes">是</option>
              </select>
              <button class="btn small primary" id="btn-save-proxy-route">保存</button>
            </div>
            <div class="hint">选择“是”，SOCKS5 先转发至本地系统的全局代理网络。</div>
          </div>

          <!-- 本地服务接口 -->
          <div class="card hidden">
            <h2>Local API</h2>
            <label>服务地址</label>
            <div class="row">
              <input id="set-api-url" class="input" readonly>
              <button class="btn small" data-copy="set-api-url">复制</button>
            </div>
            <label>Token</label>
            <div class="row">
              <input id="set-api-token" class="input" type="password" readonly>
              <button class="btn small" id="btn-token-show">显示</button>
              <button class="btn small" data-copy="set-api-token">复制</button>
            </div>
            <label>数据目录</label>
            <div class="row" style="margin-top:6px">
              <button class="btn small" id="btn-open-data">打开本地数据目录</button>
            </div>
          </div>

          <!-- 软件更新（已隐藏） -->
          <div class="card hidden">
            <h2>软件更新</h2>
            <div id="update-status" class="sub" style="margin-bottom:8px">尚未检查</div>
            <button class="btn small" id="btn-check-update">检查更新</button>
            <button class="btn small primary hidden" id="btn-install-update">下载并安装更新</button>
            <div class="hint">仅支持已安装到“应用程序”的 Apple 芯片版。安装时 macOS 会要求确认权限，完成后自动重启。</div>
          </div>

          <!-- 关于信息（已隐藏） -->
          <div class="card hidden">
            <h2>关于</h2>
            <div class="kv" id="about-box"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="app.js"></script>
  <script>
    // 监听左下角版本节点，剔除两处 8.8.8 并清理第二行开头残留的分隔符与空白
    (function() {
      const footEl = document.getElementById('app-version');
      if (!footEl) return;
      let isUpdating = false;

      const clean = () => {
        if (isUpdating) return;
        const currentHtml = footEl.innerHTML;
        if (currentHtml.includes('8.8.8')) {
          isUpdating = true;
          footEl.innerHTML = currentHtml
            // 剔除两处 8.8.8 版本号
            .replaceAll('8.8.8', '')
            // 清理第一行 IKUN 后面多余的空白或 nbsp
            .replace(/(IKUN)(?:\s|&nbsp;)+/g, '$1 ')
            // 清理第二行开头残留的竖线、斜杠、连字符及周围空白
            .replace(/(<[^>]+>)\s*([\|\-\/·]\s*)+/g, '$1')
            .trim();
          isUpdating = false;
        }
      };

      new MutationObserver(clean).observe(footEl, { childList: true, subtree: true, characterData: true });
      clean();
    })();
  </script>
</body>
</html>
